services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: miniqxt_root
      MYSQL_DATABASE: miniqxt
      MYSQL_USER: miniqxt
      MYSQL_PASSWORD: miniqxt_pass
    ports:
      - "28391:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pminiqxt_root"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 120s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Shanghai
      APP_ENV: production
      HTTP_ADDR: :8080
      MYSQL_DSN: miniqxt:miniqxt_pass@tcp(mysql:3306)/miniqxt?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai
      JWT_SECRET: miniqxt-dev-secret-change-me
      GRADER_WORKERS: "8"
      GRADER_QUEUE_SIZE: "4096"
      TRACE_BATCH_SIZE: "50"
      TRACE_FLUSH_MS: "200"
    ports:
      - "28392:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://localhost:28392
        VITE_USER_PORTAL: http://localhost:28394
    ports:
      - "28393:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped

  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://localhost:28392
        VITE_ADMIN_PORTAL: http://localhost:28393
    ports:
      - "28394:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped

volumes:
  mysql_data:
